<script>
addEventListener('load',function(){setTimeout(function(){
  var cv=document.getElementById('fx'), g=cv.getContext('2d');
  var d=g.getImageData(0,0,cv.width,cv.height).data, pintados=0;
  for(var i=0;i<d.length;i+=4) if(d[i]>20||d[i+1]>20||d[i+2]>25) pintados++;
  var r={
    reduceActivo: matchMedia('(prefers-reduced-motion: reduce)').matches,
    preloaderEnElDom: !!document.getElementById('boot'),
    bodyTieneClaseBoot: document.body.classList.contains('boot'),
    llamadasRAF: window.__raf,
    origenPrimerasRAF: window.__rafPila,
    alturaEscena: document.getElementById('scene').offsetHeight,
    alturaViewport: innerHeight,
    canvasPixelesPintados: pintados,
    capa0Activa: document.getElementById('l0').classList.contains('on'),
    navVisible: document.getElementById('head').classList.contains('in'),
    revealsVisibles: document.querySelectorAll('.reveal').length+' con opacidad '+getComputedStyle(document.querySelector('.reveal')).opacity
  };
  setTimeout(function(){
    r.llamadasRAFdespuesDe2s = window.__raf;
    var p=document.createElement('pre');p.id='dbg';p.textContent=JSON.stringify(r,null,1);
    document.body.appendChild(p);
  },2000);
},1200);});
</script>
